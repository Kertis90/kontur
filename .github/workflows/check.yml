name: Проверки Контура
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BROWSER_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Установить обработчик аудио для тестов конференций
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm run quality
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Одноразовые MySQL, Redis и файлы
        run: docker compose -f deploy/tests/browser.compose.yaml --profile files up -d --build --wait
      - name: Сборка клиента и создание приватного бакета
        run: |
          docker build --target client -t kontur-minio-client:2025-08-13 deploy/storage
          docker run --rm --network kontur-browser-check_default --entrypoint /bin/sh kontur-minio-client:2025-08-13 -ec '
            mc alias set check http://minio:9000 kontur_test disposable-browser-storage >/dev/null
            mc mb --ignore-existing check/kontur-browser-test
            mc anonymous set none check/kontur-browser-test
          '
      - run: npm run test:browser:setup
      - run: npm run test:plans:mysql
      - run: npm run test:workspace:mysql
      - run: npm run test:agent-debug:mysql
      - run: npm run test:plan-ai:mysql
      - run: npm run test:jira:mysql
      - run: npm run test:backup:mysql
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-check
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/tests/browser.compose.yaml --profile files down
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: expansion
            service: expansion-test
          - file: mysql-recovery
            service: recovery-test
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/tests/${{ matrix.file }}.compose.yaml up --build --abort-on-container-exit --exit-code-from ${{ matrix.service }}
      - if: always()
        run: docker compose -f deploy/tests/${{ matrix.file }}.compose.yaml down
