image:
  repository: registry.company.ru/platform/kontur-work
  # Пустой тег берёт версию приложения из Chart.yaml.
  tag: ""

app:
  replicas: 4
  url: https://projects.company.ru
  mysqlPoolSize: 10

worker:
  replicas: 3
  concurrency: 12
  aiConcurrency: 2

recordings:
  enabled: true
  workerReplicas: 2
  concurrency: 1
  tempSize: 24Gi
  egress:
    replicas: 3
    # Перед production замените latest проверенным digest.
    image: livekit/egress:latest

# Один стабильный endpoint HA-кластера или managed-сервиса.
database:
  host: mysql-router.database.svc.cluster.local
  port: 3306
  name: kontur_work
  user: kontur
  ssl:
    enabled: true
    rejectUnauthorized: true

# Redis Cluster/Sentinel должен предоставлять стабильный primary endpoint.
# При existingSecret реальный REDIS_URL, включая пароль, хранится в Secret.
redis:
  url: ""

s3:
  endpoint: https://s3.company.ru
  region: ru-central-1
  bucket: kontur-work-production

livekit:
  publicUrl: wss://media.company.ru
  signalHost: media.company.ru
  signalTlsSecretName: media-company-ru-tls
  redis:
    address: redis-master.cache.svc.cluster.local:6379
  turn:
    tls:
      domain: turn.company.ru
      secretName: turn-company-ru-tls
  # Отдельный пул публичных media-узлов: минимум 16 vCPU и 10 Гбит/с на узел.
  nodeSelector:
    workload: livekit-media
  tolerations:
    - key: workload
      operator: Equal
      value: livekit-media
      effect: NoSchedule
  autoscaling:
    minReplicas: 3
    maxReplicas: 20

# Рекомендуется создать Secret заранее через External Secrets/Vault.
secrets:
  existingSecret: kontur-work-production

admin:
  # После первой успешной установки можно вернуть в false.
  createOnInstall: true
  email: admin@company.ru
  name: Администратор

ingress:
  className: nginx-internal
  hosts:
    - host: projects.company.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: projects-company-ru-tls
      hosts: [projects.company.ru]

autoscaling:
  app:
    minReplicas: 4
    maxReplicas: 20
  worker:
    minReplicas: 3
    maxReplicas: 12

topologySpreadConstraints:
  app:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kontur-work
          app.kubernetes.io/instance: kontur-work
          app.kubernetes.io/component: app
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kontur-work
          app.kubernetes.io/instance: kontur-work
          app.kubernetes.io/component: app
  worker:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kontur-work
          app.kubernetes.io/instance: kontur-work
          app.kubernetes.io/component: worker
