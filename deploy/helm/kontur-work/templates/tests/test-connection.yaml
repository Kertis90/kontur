{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kontur-work.fullname" . }}-test-connection
  labels:
    {{- include "kontur-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "kontur-work.podSecurityContext" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "kontur-work.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["node", "-e"]
      args:
        - >-
          fetch('http://{{ include "kontur-work.fullname" . }}:{{ .Values.service.port }}/api/health')
          .then(async response => { if (!response.ok) throw new Error(await response.text()); })
          .catch(error => { console.error(error); process.exit(1); })
      securityContext:
        {{- include "kontur-work.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
