apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kontur-work.fullname" . }}-recording-worker
  labels:
    {{- include "kontur-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording-worker
spec:
  replicas: {{ .Values.recordings.workerReplicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kontur-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recording-worker
  template:
    metadata:
      labels:
        {{- include "kontur-work.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recording-worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kontur-work.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "kontur-work.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: recording-worker
          image: {{ include "kontur-work.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "kontur-work.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "kontur-work.fullname" . }}
            - secretRef:
                name: {{ include "kontur-work.secretName" . }}
          env:
            - name: APP_PROCESS
              value: recording-worker
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.recordings.workerResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.recordings.tempSize }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.worker }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints.worker | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "kontur-work.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: recording-worker
      {{- end }}
