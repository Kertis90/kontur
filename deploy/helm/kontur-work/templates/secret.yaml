{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontur-work.fullname" . }}
  labels:
    {{- include "kontur-work.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.webPush.enabled }}
  WEB_PUSH_PRIVATE_KEY: {{ required "webPush.privateKey обязателен, если push включён и secrets.existingSecret не задан" .Values.webPush.privateKey | quote }}
  {{- end }}
  {{ if eq .Values.database.engine "postgres" }}POSTGRES_PASSWORD{{ else }}MYSQL_PASSWORD{{ end }}: {{ required "database.password обязателен, если secrets.existingSecret не задан" .Values.database.password | quote }}
  REDIS_URL: {{ required "redis.url обязателен, если secrets.existingSecret не задан" .Values.redis.url | quote }}
  AUTH_SECRET: {{ required "secrets.authSecret обязателен, если secrets.existingSecret не задан" .Values.secrets.authSecret | quote }}
  APP_ENCRYPTION_KEY: {{ required "secrets.encryptionKey обязателен, если secrets.existingSecret не задан" .Values.secrets.encryptionKey | quote }}
  S3_ACCESS_KEY: {{ required "s3.accessKey обязателен, если secrets.existingSecret не задан" .Values.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ required "s3.secretKey обязателен, если secrets.existingSecret не задан" .Values.s3.secretKey | quote }}
  {{- if .Values.recordings.enabled }}
  EGRESS_CONFIG_BODY: |
    api_key: {{ required "livekit.apiKey обязателен для записи" .Values.livekit.apiKey | quote }}
    api_secret: {{ required "livekit.apiSecret обязателен для записи" .Values.livekit.apiSecret | quote }}
    ws_url: {{ default (printf "ws://%s-livekit:7880" (include "kontur-work.fullname" .)) .Values.recordings.egress.wsUrl | quote }}
    insecure: {{ .Values.recordings.egress.insecure }}
    enable_chrome_sandbox: true
    redis:
      address: {{ .Values.livekit.redis.address | quote }}
      {{- with .Values.livekit.redis.username }}
      username: {{ . | quote }}
      {{- end }}
      {{- with .Values.livekit.redis.password }}
      password: {{ . | quote }}
      {{- end }}
    health_port: 8080
    prometheus_port: 9090
    session_limits:
      file_output_max_duration: 12h
  {{- end }}
  {{- if or .Values.livekit.enabled .Values.recordings.enabled }}
  LIVEKIT_API_KEY: {{ required "livekit.apiKey обязателен" .Values.livekit.apiKey | quote }}
  LIVEKIT_API_SECRET: {{ required "livekit.apiSecret обязателен" .Values.livekit.apiSecret | quote }}
  LIVEKIT_CONFIG: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      tcp_port: {{ .Values.livekit.rtc.tcpPort }}
      udp_port: {{ .Values.livekit.rtc.udpPort }}
      use_external_ip: {{ .Values.livekit.rtc.useExternalIP }}
    redis:
      address: {{ required "livekit.redis.address обязателен" .Values.livekit.redis.address | quote }}
      {{- with .Values.livekit.redis.username }}
      username: {{ . | quote }}
      {{- end }}
      {{- with .Values.livekit.redis.password }}
      password: {{ . | quote }}
      {{- end }}
    keys:
      {{ .Values.livekit.apiKey | quote }}: {{ .Values.livekit.apiSecret | quote }}
    turn:
      enabled: {{ .Values.livekit.turn.enabled }}
      udp_port: {{ .Values.livekit.turn.udpPort }}
      {{- if .Values.livekit.turn.tls.enabled }}
      domain: {{ required "livekit.turn.tls.domain обязателен для TURN/TLS" .Values.livekit.turn.tls.domain | quote }}
      tls_port: {{ .Values.livekit.turn.tls.port }}
      cert_file: /etc/livekit/tls/tls.crt
      key_file: /etc/livekit/tls/tls.key
      {{- end }}
    prometheus_port: {{ .Values.livekit.prometheusPort }}
  {{- end }}
  {{- if .Values.communications.speechToText.enabled }}
  STT_API_KEY: {{ .Values.communications.speechToText.apiKey | quote }}
  {{- end }}
  {{- if .Values.communications.telephony.enabled }}
  TELEPHONY_API_TOKEN: {{ required "communications.telephony.apiToken обязателен при включённой телефонии" .Values.communications.telephony.apiToken | quote }}
  TELEPHONY_WEBHOOK_SECRET: {{ required "communications.telephony.webhookSecret обязателен при включённой телефонии" .Values.communications.telephony.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.admin.createOnInstall }}
  ADMIN_PASSWORD: {{ required "admin.password обязателен при admin.createOnInstall=true" .Values.admin.password | quote }}
  {{- else }}
  ADMIN_PASSWORD: ""
  {{- end }}
{{- end }}
