{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontur-work.fullname" . }}
  labels:
    {{- include "kontur-work.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kontur-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.app.port }}
  {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.monitoring.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.app.port }}
  {{- end }}
{{- end }}

