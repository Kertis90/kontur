apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kontur-work.fullname" . }}
  labels:
    {{- include "kontur-work.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: {{ .Values.app.port | quote }}
  HOSTNAME: "0.0.0.0"
  APP_URL: {{ .Values.app.url | quote }}
  MYSQL_HOST: {{ .Values.database.host | quote }}
  MYSQL_PORT: {{ .Values.database.port | quote }}
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  MYSQL_USER: {{ .Values.database.user | quote }}
  MYSQL_POOL_SIZE: {{ .Values.app.mysqlPoolSize | quote }}
  MYSQL_SSL: {{ .Values.database.ssl.enabled | quote }}
  MYSQL_SSL_REJECT_UNAUTHORIZED: {{ .Values.database.ssl.rejectUnauthorized | quote }}
  {{- with .Values.database.ssl.ca }}
  MYSQL_SSL_CA: |-{{ . | nindent 4 }}
  {{- end }}
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.s3.forcePathStyle | quote }}
  MAX_ATTACHMENT_BYTES: {{ .Values.app.maxAttachmentBytes | quote }}
  LIVEKIT_API_URL: {{ default (printf "http://%s-livekit:7880" (include "kontur-work.fullname" .)) .Values.livekit.apiUrl | quote }}
  LIVEKIT_WS_URL: {{ required "livekit.publicUrl обязателен" .Values.livekit.publicUrl | quote }}
  {{- if .Values.communications.speechToText.enabled }}
  STT_API_URL: {{ required "communications.speechToText.apiUrl обязателен при включённой расшифровке" .Values.communications.speechToText.apiUrl | quote }}
  STT_MODEL: {{ .Values.communications.speechToText.model | quote }}
  STT_LANGUAGE: {{ .Values.communications.speechToText.language | quote }}
  STT_TIMEOUT_MS: {{ .Values.communications.speechToText.timeoutMs | quote }}
  {{- end }}
  {{- if .Values.communications.telephony.enabled }}
  TELEPHONY_API_URL: {{ required "communications.telephony.apiUrl обязателен при включённой телефонии" .Values.communications.telephony.apiUrl | quote }}
  TELEPHONY_FROM_NUMBER: {{ required "communications.telephony.fromNumber обязателен при включённой телефонии" .Values.communications.telephony.fromNumber | quote }}
  TELEPHONY_TIMEOUT_MS: {{ .Values.communications.telephony.timeoutMs | quote }}
  {{- end }}
  ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  ADMIN_NAME: {{ .Values.admin.name | quote }}
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  AI_WORKER_CONCURRENCY: {{ .Values.worker.aiConcurrency | default 2 | quote }}
  RECORDING_RETENTION_DAYS: {{ .Values.recordings.retentionDays | quote }}
  RECORDING_ENABLED: {{ .Values.recordings.enabled | quote }}
  RECORDING_WORKER_CONCURRENCY: {{ .Values.recordings.concurrency | quote }}
  RECORDING_TRANSCRIBE_MAX_GB: {{ .Values.recordings.maxTranscribeGB | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  INTEGRATION_ALLOWED_PRIVATE_HOSTS: {{ .Values.integrations.allowedPrivateHosts | quote }}
  OUTBOX_POLL_MS: {{ .Values.worker.outboxPollMs | quote }}
  WEB_PUSH_ENABLED: {{ .Values.webPush.enabled | quote }}
  WEB_PUSH_SUBJECT: {{ .Values.webPush.subject | quote }}
  {{- if .Values.webPush.enabled }}
  WEB_PUSH_PUBLIC_KEY: {{ required "webPush.publicKey обязателен при webPush.enabled=true" .Values.webPush.publicKey | quote }}
  {{- else }}
  WEB_PUSH_PUBLIC_KEY: {{ .Values.webPush.publicKey | quote }}
  {{- end }}
