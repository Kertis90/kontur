# Isolated restore drill. No published ports or connection to the production network.
services:
  mysql-restore:
    # Проверка восстановления использует тот же источник образа, что и установка.
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${RESTORE_MYSQL_PASSWORD:?Set RESTORE_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${RESTORE_MYSQL_DATABASE:-kontur_restore_drill}
    command: ["--log-bin-trust-function-creators=1"]
    volumes: [restore_data:/var/lib/mysql]
    networks: [restore]
volumes:
  restore_data:
networks:
  restore:
    internal: true
