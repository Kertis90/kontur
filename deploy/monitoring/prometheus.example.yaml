global:
  scrape_interval: 30s
rule_files: ["/etc/prometheus/kontur-alerts.yaml"]
scrape_configs:
  - job_name: kontur-work
    scheme: https
    metrics_path: /api/work/operations/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/kontur_metrics_token
    static_configs:
      - targets: ["projects.example.ru"]
