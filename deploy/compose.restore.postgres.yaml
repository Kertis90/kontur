# Отдельный стенд восстановления без опубликованных портов и доступа к рабочей сети.
services:
  postgres-restore:
    # Проверка восстановления использует тот же источник образа, что и установка.
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    environment:
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?Set RESTORE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESTORE_POSTGRES_DATABASE:-kontur_restore_drill}
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:-kontur}
    volumes: [restore_postgres_data:/var/lib/postgresql]
    networks: [restore]
volumes:
  restore_postgres_data:
networks:
  restore:
    internal: true
